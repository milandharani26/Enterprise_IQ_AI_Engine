name: Deploy Monolith to AWS EC2

on:
  push:
    branches:
      - main # Change this to your default branch if different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cpanel/package-lock.json'

      - name: Install Frontend Dependencies & Build Static Export
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: |
          cd cpanel
          npm ci
          npm run build

      - name: Copy Files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          # Exclude source code files of frontend that are already compiled, and heavy folders
          source: "main.py,pyproject.toml,poetry.lock,engine/**,shared/**,scripts/**,cpanel/out/**"
          target: "/home/${{ secrets.EC2_USER }}/enterpriseiq_ai"

      - name: SSH to EC2 & Execute Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/enterpriseiq_ai
            
            # Setup/overwrite production environment variables
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            
            # Ensure poetry is installed and available in path
            export PATH="/home/${{ secrets.EC2_USER }}/.local/bin:$PATH"
            if ! command -v poetry &> /dev/null; then
              echo "Installing Poetry..."
              curl -sSL https://install.python-poetry.org | python3 -
            fi
            
            # Configure poetry to make virtualenv local to the project folder
            poetry config virtualenvs.in-project true
            
            # Install backend dependencies
            poetry install --no-root
            
            # Run migrations
            poetry run alembic upgrade head
            
            # Setup/restart systemd service for FastAPI
            # (Assumes enterpriseiq.service is copied or linked to /etc/systemd/system/)
            if [ -f "/etc/systemd/system/enterpriseiq.service" ]; then
              echo "Restarting service..."
              sudo systemctl daemon-reload
              sudo systemctl restart enterpriseiq
            else
              echo "Service file not found in /etc/systemd/system/."
              echo "Please follow setup guide to register and start the systemd service."
            fi
