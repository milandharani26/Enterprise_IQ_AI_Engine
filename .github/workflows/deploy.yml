name: Deploy All-in-One Monolith to AWS EC2

on:
  push:
    branches:
      - production # Triggering on production branch based on your latest push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/enterpriseiq-ai:latest
            ${{ secrets.DOCKER_USERNAME }}/enterpriseiq-ai:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH to EC2 & Execute Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            # 1. Install Docker if not already present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ${{ secrets.EC2_USER }}
            fi

            # 2. Setup/overwrite production environment variables
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF

            # 3. Log in to Docker Hub on the EC2 host (Optional for public repos, but good practice)
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # 4. Stop and remove previously running container
            echo "Stopping and removing existing enterpriseiq-ai container..."
            sudo docker stop enterpriseiq-ai || true
            sudo docker rm enterpriseiq-ai || true

            # 5. Run the unified all-in-one container
            echo "Starting new enterpriseiq-ai container..."
            sudo docker run -d \
              --name enterpriseiq-ai \
              --restart always \
              -p 8000:8000 \
              -p 5433:5433 \
              -p 6379:6379 \
              --env-file .env \
              -v enterpriseiq-db-data:/var/lib/postgresql \
              ${{ secrets.DOCKER_USERNAME }}/enterpriseiq-ai:latest

            # 6. Verify container status
            sleep 5
            sudo docker ps | grep enterpriseiq-ai
